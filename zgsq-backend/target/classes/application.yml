# [软著核心代码] application.yml - 智光云枢管廊照明管理系统 SpringBoot 配置文件
# ========================================================
# 本文件使用占位符形式（${xxx}）引用外部配置，部署时请通过
# application-dev.yml / application-prod.yml 覆盖，或直接配置环境变量。
# 注意：验证时用 H2 内存数据库，生产部署请切换到 MySQL 5.7。
# ========================================================

server:
  port: ${ZGSQ_SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: zgsq-illumination
  # ========= 数据源 =========
  # 默认 H2 内存数据库（验证用，无需 MySQL）
  # 生产部署时，替换为 MySQL 配置：
  #   driver-class-name: com.mysql.cj.jdbc.Driver
  #   url: jdbc:mysql://127.0.0.1:3306/zgsq_illumination?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
  #   username: root
  #   password: root
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:zgsqdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  sql:
    schema-locations: classpath:sql/h2-init.sql
    continue-on-error: true
    init:
      mode: always
      # 生产部署 MySQL 后，可开启自动初始化：
      # mode: always
      # schema-locations: classpath:sql/schema.sql
      # data-locations: classpath:sql/data.sql
  # 开发时允许循环依赖（Lombok + MyBatis 场景常见）
  main:
    allow-circular-references: true

# ========= MyBatis-Plus 全局配置 =========
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*Mapper.xml,classpath*:com/zgsq/illumination/**/mapper/*Mapper.xml
  type-aliases-package: com.zgsq.illumination.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto

# ========= 智光云枢专属业务配置 =========
zgsq:
  admin-token: ${ZGSQ_ADMIN_TOKEN:admin-token}
  guanlang-prefix: GL
  peiguang-prefix: PG
  lianlu-prefix: LL
  default-patrol-frequency: 30

# ========= 日志配置 =========
logging:
  level:
    root: info
    com.zgsq.illumination: debug
    com.baomidou.mybatisplus: warn
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
