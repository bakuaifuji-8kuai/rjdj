<!-- [软著核心代码] index.html + 智光云枢平台 HTML 入口页 -->
<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 移动端适配：视口宽度等于设备宽度 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO 描述 -->
    <meta name="description" content="智光云枢 - 城市照明物联管控平台，管廊-链路-配光全链路管理" />
    <!-- 浏览器标题 -->
    <title>智光云枢 - 城市照明物联管控平台</title>
    <!-- 预加载 icon 字体，避免闪烁 -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💡</text></svg>" />
  </head>
  <body>
    <!-- Vue 3 应用挂载点 -->
    <div id="app"></div>
    <!-- ES Module 方式加载入口脚本 -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
